[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-pipeline"
version = "0.1.0"
description = "AI-native, spec-driven development pipeline prototype"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "anthropic>=0.40",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "httpx>=0.27",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["pipeline*", "dashboard*"]
exclude = ["targets*", "sample-target*", "tests*", "runs*"]

[tool.setuptools.package-data]
"pipeline.llm" = ["prompts/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: Typer/FastAPI use function-call defaults idiomatically.
# UP042: StrEnum requires Python 3.11+ — we use it, but mixing inheritance is fine too.
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests (may be slower)",
]
